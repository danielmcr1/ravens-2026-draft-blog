name: Super-Linter — Code Quality Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  lint:
    name: Run Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.3.1
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # Look for linter configs in the repo root, not .github/linters/
          LINTER_RULES_PATH: "."
          # Explicitly name the config files so v7 picks them up reliably
          MARKDOWN_CONFIG_FILE: ".markdownlint.json"
          DOCKERFILE_HADOLINT_FILE_NAME: ".hadolint.yaml"
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true
          VALIDATE_BASH: true
          FILTER_REGEX_EXCLUDE: ".*(_site|vendor|.bundle).*"
